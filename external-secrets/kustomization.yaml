apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: external-secrets
    version: 1.3.2
    namespace: external-secrets
    repo: https://charts.external-secrets.io
    releaseName: external-secrets
    valuesInline:
      installCRDs: true

resources:
  - aws-secrets-manager.yaml